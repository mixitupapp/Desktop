<!DOCTYPE html>

<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8" />
    <title>Mix It Up - Overlay</title>
    <link rel="icon" type="image/x-icon" href="https://files.mixitup.bot/static/branding/mixitup.ico">

    <script>
        var connection;
        var isDebug = false;

        function openWebsocketConnection(path) {
            openWebsocketConnectionWithAddressPort(window.location.hostname, window.location.port, path);
        }

        function openWebsocketConnectionWithAddressPort(address, port, path) {
            try {
                var protocol = "ws";
                if (window.location.protocol === "https:") {
                    protocol = "wss";
                }
                connection = new WebSocket(protocol + "://" + address + ":" + port + path);

                // When the connection is open, send some data to the server
                connection.onopen = function () {
                    sendPacket('ConnectionStart', '');
                };

                // Log messages from the server
                connection.onmessage = function (e) {
                    var packet = getDataFromJSON(e.data);
                    if (packet !== null && typeof packet.Type !== 'undefined') {
                        if (packet.Type === "Debug") {
                            isDebug = true;
                        }
                        else if (packet.Type === "Test") {
                            sendPacket('Test', '');
                        }
                    }
                    packetReceived(packet);
                };

                // Log errors
                connection.onerror = function (error) {
                    logToSessionStorage('WebSocket Error ' + error.toString());
                };

                connection.onclose = function (e) {
                    setTimeout(function () { openWebsocketConnectionWithAddressPort(address, port, path); }, 1000);
                };
            }
            catch (err) { logToSessionStorage(err); }
        }

        function sendPacket(type, data) {
            try {
                if (connection !== null && connection.readyState === WebSocket.OPEN) {
                    var packet = { Type: type, Data: data };
                    connection.send(JSON.stringify(packet));
                }
            }
            catch (err) { logToSessionStorage(err); }
        }

        function getDataFromJSON(packet) {
            try {
                if (packet !== null) {
                    return JSON.parse(packet);
                }
            }
            catch (err) { logToSessionStorage(err); }
            return null;
        }

        function isStringEmpty(str) {
            return (!str || 0 === str.length);
        }

        function logToSessionStorage(log) {
            try {
                // Disabling session storage logging unless needed for diagnosing issues.
                //
                //if (typeof (Storage) !== "undefined") {
                //    if (!sessionStorage.logs) {
                //        sessionStorage.logs = "";
                //    }
                //    sessionStorage.logs += "\n\n" + log.toString();
                //}
            }
            catch (err) { }
        }
    </script>

    <script src="/scripts/jquery-3.6.0.min.js"></script>

    <script src="https://code.responsivevoice.org/responsivevoice.js?key={ResponsiveVoiceAPIKey}"></script>
</head>
<body style="background-color: transparent; overflow: hidden; position: absolute; width: 100%; max-width: 100%; min-width: 100%; height: 100%; max-height: 100%; min-height: 100%; margin: 0px;">

    <div id="mainOverlay" style="position: absolute; width: 100%; max-width: 100%; min-width: 100%; height: 100%; max-height: 100%; min-height: 100%; margin: 0px;"></div>

    <p id="connectionTest" style="visibility: hidden; font-size: 100px; color: red; white-space: nowrap; position: absolute; margin: 0px; left: 50%; top: 50%; transform: translate(-50%, -50%);">Connection Test!</p>

    <script>
        var mainOverlayDiv = document.getElementById('mainOverlay');
        var noTextToSpeechDiv = document.getElementById('noTextToSpeechDiv');

        var iframes = new Map();
        var disableIFrameRemoval = {DisableIFrameRemoval};

        function removeIFrame(id) {
            if (iframes.has(id)) {
                var iframeContainer = iframes.get(id);
                if (disableIFrameRemoval) {
                    iframeContainer.style.display = "none";
                }
                else {
                    mainOverlayDiv.removeChild(iframeContainer);
                }

                iframes.delete(id);
            }
        }

        function packetReceived(packet) {
            try {
                if (packet != null) {
                    if (Array.isArray(packet)) {                        
                        processPackets(packet);
                    }
                    else {
                        processPackets([packet]);
                    }
                }
            }
            catch (err) { logException(err); }
        }

        function processPackets(packets) {
            var newIFrameContainers = new Array();
        
            for (var i = 0; i < packets.length; i++) {
                let packet = packets[i];
                
                if (typeof packet.Type !== 'undefined' && packet.Type != null) {
                    if (packet.Type === 'Add') {
                        newIFrameContainers.push(processAdd(packet.Data));
                    }
                    else if (packet.Type === 'Remove') {
                        processRemove(packet.Data);
                    }
                    else if (packet.Type === 'Clear') {
                        processClear(packet.Data);
                    }
                    else if (packet.Type === 'Function') {
                        processFunction(packet.Data);
                    }
                    else if (packet.Type === 'ResponsiveVoice') {
                        processResponsiveVoice(packet.Data);
                    }
                    else if (packet.Type == 'Test') {
                        var connectionTest = document.getElementById("connectionTest");
                        connectionTest.style.visibility = 'visible';
                        setTimeout(function () {
                            connectionTest.style.visibility = 'hidden';
                        }, 3000);
                    }
                }
            }
            
            for (var i = 0; i < newIFrameContainers.length; i++) {
                if (newIFrameContainers[i] != null) {
                    mainOverlayDiv.appendChild(newIFrameContainers[i]);
                }
            }
        }

        function processAdd(data) {
            if (!iframes.has(data.ID)) {
                var iframeContainer = createIFrameContainer(data.HTML, data.Layer);

                iframes.set(data.ID, iframeContainer);
                
                return iframeContainer;
            }
            return null;
        }

        function processRemove(data) {
            if (iframes.has(data.ID)) {
                removeIFrame(data.ID);
            }
        }

        function processClear(data) {
            iframes.forEach((value, key) => {
                mainOverlayDiv.removeChild(value);
            });
            
            iframes.clear();
        }

        function processFunction(data) {
            if (iframes.has(data.ID)) {
                var iframeContainer = iframes.get(data.ID);

                callIFrameFunction(iframeContainer, data.FunctionName, data.Parameters);
            }
        }

        function processResponsiveVoice(data) {
            responsiveVoice.forcedFallbackMode = true;
            if (responsiveVoice.voiceSupport()) {
                responsiveVoice.speak(data.Text, data.Voice, { volume: data.Volume, pitch: data.Pitch, rate: data.Rate, onend: function () {
                    sendPacket("ResponseVoiceTextToSpeechComplete", { "ID": data.ID });
                }});
            }
        }

        function createIFrameContainer(html, layer) {
            var div = document.createElement("div");
            div.style = "display: block; position: absolute; top: 0px; left: 0px; width: 100%; height: 100%; margin: 0; padding: 0;";
            div.style.zIndex = layer.toString();

            var iframe = document.createElement("iframe");
            iframe.style = "position: absolute; top: 0px; left: 0px; width: 100%; height: 100%; margin: 0; padding: 0; border: none;";
            iframe.sandbox = "allow-scripts allow-same-origin";
            iframe.allow = "autoplay; fullscreen";
            iframe.srcdoc = html;
            
            iframe.addEventListener("load", ev => {
                var passedDownStyles = document.createElement("style");
                passedDownStyles.textContent = "";
                for (var i = 0; i < document.styleSheets.length; i++)
                {
                    var ruleList = document.styleSheets[i].cssRules;
                    for (var j = 0; j < ruleList.length; j++)
                    {
                        passedDownStyles.textContent += ruleList[j].cssText;
                    }
                }
                ev.target.contentDocument.head.appendChild(passedDownStyles);
            });
            
            div.appendChild(iframe);

            return div;
        }

        function callIFrameFunction(iframeContainer, functionName, parameters) {
            iframeContainer.firstChild.contentWindow[functionName](parameters);
        }

        function sendIFrameMessage(iframe, obj) {
            iframe.contentWindow.postMessage(JSON.stringify(obj), '*');
        }

        function logException(err) {
            console.error(err);
            logToSessionStorage(err);
        }

        openWebsocketConnection("{WebSocketConnectionURL}");

        window.onmessage = function (message) {
            if (message != null && message.data != null && message.data.length > 0) {
                try {
                    var obj = JSON.parse(message.data);
                    if (typeof obj.Type !== 'undefined' && typeof obj.ID !== 'undefined') {
                        if (obj.Type == 'Remove') {
                            if (iframes.has(obj.ID)) {
                                removeIFrame(obj.ID);
                            }
                        }
                        else {
                            sendPacket(obj.Type, obj);
                        }
                    }
                }
                catch (err) { logException(err); }
            }
        };
    </script>
</body>
</html>
