<template id="section-{SectionID}">
    <div>
        <div class="header">{Name}</div>
        <div class="columns columns-{SectionID}"></div>
    </div>
</template>

<template id="column-{SectionID}">
    <div style="width: {ColumnWidthPercentage}vw;"></div>
</template>

<template id="item-{SectionID}">
    <div class="text"></div>
</template>
