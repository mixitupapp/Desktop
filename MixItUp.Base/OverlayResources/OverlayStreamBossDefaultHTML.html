<div class="mainContainer">
  <div class="imageContainer">
    <img id="bossImage" class="image">
  </div>
  
  <div class="infoContainer">
    <div class="infoContainerVerticalSplit">
      <div class="verticalFlexAuto">
        <div style="display: flex;">
          <span id="bossName" class="text flexAuto"></span>

          <span class="text">
            <span id="bossHealth"></span>
            <span> / </span>
            <span id="bossMaxHealth"></span>
          </span>
        </div>
      </div>
      
      <div class="verticalFlexAuto">
        <div class="healthBarDamage">
          <div id="bossHealthBarRemaining" class="healthRemainingBar" />
        </div>
      </div>
    </div>
  </div>
</div>
